[project]
name = "Titular"
authors = [{ name = "Pedro Sousa Lacerda", email = "pslacerda@gmail.com" }]
version = "0.1.0"
requires-python = ">=3.13, <3.14"
description = "A química do pH e pKa explicate e ilustrada."
dependencies = [
    "dimorphite-dl",
    "rdkit",
    "streamlit",
    "plotly-express",
    "polars",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titular"]
